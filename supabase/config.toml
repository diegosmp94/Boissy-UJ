project_id = "boissy-uj-local"

[db]
major_version = 17

# Configuration de code uniquement. NE PAS déployer en production.
# La clé Stripe TEST, la signature et le service role restent des secrets Supabase.
[functions.premium-stripe-test-webhook]
verify_jwt = false # Signatures Stripe vérifiées dans le handler sur le corps brut

[functions.premium-stripe-test-checkout]
verify_jwt = true # Auth JWT + confirmation Auth côté handler


# Only on isolated staging: member JWT + verified Auth user and explicit TEST gate.
[functions.premium-stripe-test-cancel]
verify_jwt = true

# Stripe TEST donations: deploy ONLY to a distinct isolated staging Supabase.
[functions.donation-stripe-test-checkout]
verify_jwt = true

[functions.donation-stripe-test-webhook]
verify_jwt = false # official Stripe signature over unmodified RAW body required

# TEST event tickets: only on distinct Supabase staging after approval.
[functions.event-ticket-stripe-test-checkout]
verify_jwt = true

[functions.event-ticket-stripe-test-webhook]
verify_jwt = false # signed Stripe raw body, never JWT-only
