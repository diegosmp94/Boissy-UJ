name: Aperçu Boissy-UJ (GitHub Pages)
on:
  push:
    branches:
      - feat/fondations-site-v1
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "boissy-uj-preview"
  cancel-in-progress: true
jobs:
  deploy-preview:
    if: github.ref == 'refs/heads/feat/fondations-site-v1'
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Static smoke tests
        run: npm test
      - name: Prepare preview artifacts
        run: |
          mkdir -p _site
          cp -R *.html *.js *.mjs *.css assets _site/
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
