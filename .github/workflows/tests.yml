name: Tests du socle Boissy-UJ
on:
  push:
    branches:
      - "feat/**"
      - main
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Vérifier la syntaxe JavaScript
        run: node --check app.js
      - name: Lancer les tests
        run: npm test
      - name: Préparer la préproduction sans fichiers internes
        run: |
          npm run build:preview
          npm run audit:preview
          test -f dist/index.html
          test -f dist/app.js
          test -f dist/assets/ecusson.svg
          test ! -e dist/docs
          test ! -e dist/tests
          test ! -e dist/.github
      - name: Inventorier le stockage navigateur et les domaines tiers
        run: npm run audit:privacy
      - name: Tester dans Chromium les routes publiques et écrans mobiles
        run: |
          if node --input-type=module -e "import {SITE_MAINTENANCE} from './site-maintenance-config.mjs'; process.exit(SITE_MAINTENANCE.enabled ? 0 : 1)"; then
            npm run smoke:maintenance
          else
            npm run smoke:browser
          fi
      - name: Conserver les captures et rapports de recette
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boissy-uj-navigateur-p1
          path: smoke-artifacts/
          if-no-files-found: ignore
          retention-days: 7
